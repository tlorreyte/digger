# Example Dex config for OpenTaco: GitHub SSO, with the user's GitHub orgs
# exposed in the "groups" claim. Reference: https://dexidp.io/docs/connectors/github/
#
# The issuer must be reachable at the same URL by the browser and by the UI
# container. The docker-compose stack uses http://dex:5556/dex, so add
# "127.0.0.1 dex" to /etc/hosts on the machine running the browser. In
# production, use the public HTTPS URL of Dex.
issuer: http://dex:5556/dex

storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

connectors:
  - type: github
    id: github
    name: GitHub
    config:
      clientID: $GITHUB_CLIENT_ID
      clientSecret: $GITHUB_CLIENT_SECRET
      redirectURI: http://dex:5556/dex/callback
      # Only members of these orgs can sign in. The groups claim then holds the
      # user's teams in these orgs as "org:team"; OpenTaco shows an org only if
      # the user is in at least one of its teams.
      orgs:
        - name: my-github-org
      # Without "orgs", any GitHub user can sign in and "loadAllGroups: true"
      # puts all their orgs ("org") and teams ("org:team") in the groups claim.
      # Dex ignores loadAllGroups when orgs is set.
      # loadAllGroups: true
      teamNameField: slug
      # useLoginAsID: true

staticClients:
  - id: digger-ui
    name: OpenTaco UI
    secretEnv: DIGGER_UI_CLIENT_SECRET
    redirectURIs:
      - http://localhost:3030/api/auth/callback
