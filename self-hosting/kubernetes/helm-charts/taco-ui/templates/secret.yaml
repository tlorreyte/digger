{{- if not .Values.ui.secret.useExistingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taco-ui.fullname" . }}-secret
  labels:
    {{- include "taco-ui.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.ui.env.publicUrl }}
  PUBLIC_URL: {{ .Values.ui.env.publicUrl | quote }}
  {{- end }}
  # Dex OIDC configuration
  {{- if .Values.ui.env.dex.issuerUrl }}
  DEX_ISSUER_URL: {{ .Values.ui.env.dex.issuerUrl | quote }}
  {{- end }}
  {{- if .Values.ui.env.dex.clientId }}
  DEX_CLIENT_ID: {{ .Values.ui.env.dex.clientId | quote }}
  {{- end }}
  {{- if .Values.ui.env.dex.clientSecret }}
  DEX_CLIENT_SECRET: {{ .Values.ui.env.dex.clientSecret | quote }}
  {{- end }}
  {{- if .Values.ui.env.dex.redirectUri }}
  DEX_REDIRECT_URI: {{ .Values.ui.env.dex.redirectUri | quote }}
  {{- end }}
  {{- if .Values.ui.env.session.cookiePassword }}
  SESSION_COOKIE_PASSWORD: {{ .Values.ui.env.session.cookiePassword | quote }}
  {{- end }}
  {{- if .Values.ui.env.session.cookieName }}
  SESSION_COOKIE_NAME: {{ .Values.ui.env.session.cookieName | quote }}
  {{- end }}
  {{- if .Values.ui.env.session.cookieDomain }}
  SESSION_COOKIE_DOMAIN: {{ .Values.ui.env.session.cookieDomain | quote }}
  {{- end }}
  
  # Backend service URLs
  {{- if .Values.ui.env.backends.orchestratorUrl }}
  ORCHESTRATOR_BACKEND_URL: {{ .Values.ui.env.backends.orchestratorUrl | quote }}
  {{- end }}
  {{- if .Values.ui.env.backends.orchestratorSecret }}
  ORCHESTRATOR_BACKEND_SECRET: {{ .Values.ui.env.backends.orchestratorSecret | quote }}
  {{- end }}
  {{- if .Values.ui.env.backends.driftReportingUrl }}
  DRIFT_REPORTING_BACKEND_URL: {{ .Values.ui.env.backends.driftReportingUrl | quote }}
  {{- end }}
  {{- if .Values.ui.env.backends.driftReportingWebhookSecret }}
  DRIFT_REPORTING_BACKEND_WEBHOOK_SECRET: {{ .Values.ui.env.backends.driftReportingWebhookSecret | quote }}
  {{- end }}
  {{- if .Values.ui.env.backends.statesmanUrl }}
  STATESMAN_BACKEND_URL: {{ .Values.ui.env.backends.statesmanUrl | quote }}
  {{- end }}
  {{- if .Values.ui.env.backends.statesmanWebhookSecret }}
  STATESMAN_BACKEND_WEBHOOK_SECRET: {{ .Values.ui.env.backends.statesmanWebhookSecret | quote }}
  {{- end }}
  {{- if .Values.ui.env.backends.tokensServiceUrl }}
  TOKENS_SERVICE_BACKEND_URL: {{ .Values.ui.env.backends.tokensServiceUrl | quote }}
  {{- end }}
{{- end }}
