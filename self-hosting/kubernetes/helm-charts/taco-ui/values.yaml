# values.yaml
#
# This chart creates environment variables from these values.
# You can either:
#   1. Set values here (chart creates secrets automatically)
#   2. Use secret.useExistingSecret=true and create your own secret
#
# See secrets-example/ui.env for a complete example

ui:
  # Image configuration
  # This is a standalone Node.js + TanStack Start SSR app
  # The image includes:
  #   - Production-optimized Node.js server with static asset serving
  #   - Built for linux/amd64 platform (GCP/GKE compatible)
  #
  # Note: Full registry path comes from global.imageRegistry
  # Public image: ghcr.io/diggerhq/digger/taco-ui
  image:
    # Optional per-chart registry override. Falls back to global.imageRegistry.
    registry: ""
    repository: digger/taco-ui
    tag: "latest"
    pullPolicy: "IfNotPresent"

  # Number of replicas
  replicaCount: 1

  # Pod annotations for ui pods.
  # These override matching keys from global.podAnnotations.
  podAnnotations: {}

  # Service configuration
  # Creates: PORT (set automatically from port)
  service:
    type: ClusterIP
    port: 3030             # PORT - taco-ui Node.js server listens on port 3030

  # Environment configuration
  # Creates environment variables for the UI service
  env:
    # Public URL for UI links and hostname-derived instructions
    # Creates: PUBLIC_URL
    publicUrl: ""  # PUBLIC_URL (e.g., https://your-domain.com)

    # Allowed hosts (comma-separated)
    # Creates: ALLOWED_HOSTS
    allowedHosts: ""  # ALLOWED_HOSTS
    
    # Dex OIDC configuration. Dex is not part of this chart; deploy it with the
    # official chart (helm repo add dex https://charts.dexidp.io; chart "dex")
    # using a GitHub connector and a "digger-ui" static client.
    # Creates: DEX_ISSUER_URL, DEX_CLIENT_ID, DEX_CLIENT_SECRET, DEX_REDIRECT_URI
    dex:
      issuerUrl: ""          # DEX_ISSUER_URL (e.g., https://dex.your-domain.com/dex)
      clientId: "digger-ui"  # DEX_CLIENT_ID
      clientSecret: ""       # DEX_CLIENT_SECRET
      redirectUri: ""        # DEX_REDIRECT_URI (e.g., https://your-domain.com/api/auth/callback)

    # Session cookie configuration
    # Creates: SESSION_COOKIE_PASSWORD, SESSION_COOKIE_NAME, SESSION_COOKIE_DOMAIN
    session:
      cookiePassword: ""     # SESSION_COOKIE_PASSWORD (at least 32 characters)
      cookieName: ""         # SESSION_COOKIE_NAME (optional, defaults to digger-session)
      cookieDomain: ""       # SESSION_COOKIE_DOMAIN (optional)
    
    # PostHog configuration (optional)
    # Creates: VITE_POSTHOG_KEY, VITE_POSTHOG_HOST
    posthog:
      key: ""                # VITE_POSTHOG_KEY
      host: ""               # VITE_POSTHOG_HOST
    
    # Backend service URLs (for in-cluster communication)
    # Creates: ORCHESTRATOR_BACKEND_URL, ORCHESTRATOR_BACKEND_SECRET,
    #          DRIFT_REPORTING_BACKEND_URL, DRIFT_REPORTING_BACKEND_WEBHOOK_SECRET,
    #          STATESMAN_BACKEND_URL, STATESMAN_BACKEND_WEBHOOK_SECRET,
    #          TOKENS_SERVICE_BACKEND_URL
    backends:
      # Orchestrator (Digger Backend)
      orchestratorUrl: ""           # ORCHESTRATOR_BACKEND_URL (e.g., http://opentaco-taco-orchestrator-web:3000)
      orchestratorSecret: ""        # ORCHESTRATOR_BACKEND_SECRET
      
      # Drift Reporting
      driftReportingUrl: ""         # DRIFT_REPORTING_BACKEND_URL (e.g., http://opentaco-drift:3004) -> the drift service 
      driftReportingWebhookSecret: ""  # DRIFT_REPORTING_BACKEND_WEBHOOK_SECRET
      
      # Statesman
      statesmanUrl: ""              # STATESMAN_BACKEND_URL (e.g., http://opentaco-statesman:8080) -> the statesman service
      statesmanWebhookSecret: ""    # STATESMAN_BACKEND_WEBHOOK_SECRET

      # Token Service
      tokensServiceUrl: ""          # TOKENS_SERVICE_BACKEND_URL (e.g., http://opentaco-taco-token-service:8081)

  # Custom environment variables
  customEnv: []
  #   - name: MY_CUSTOM_ENV
  #     value: "my-value"

  # Secret configuration
  # For production, create secret externally: kubectl create secret generic ui-secrets --from-env-file=.secrets/ui.env
  # For development, set useExistingSecret=false and fill secret fields below
  secret:
    useExistingSecret: true
    existingSecretName: "ui-secrets"

  # Ingress configuration
  ingress:
    enabled: false
    className: "nginx"
    annotations: {}
      # cert-manager.io/cluster-issuer: letsencrypt-prod
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: taco.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
    #  - secretName: taco-ui-tls
    #    hosts:
    #      - taco.example.com

  # Resource limits
  resources: {}
    # limits:
    #   cpu: 500m
    #   memory: 512Mi
    # requests:
    #   cpu: 250m
    #   memory: 256Mi

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity
  affinity: {}

# Global configuration (optional)
global:
  imagePullSecrets: []
  podAnnotations: {}
